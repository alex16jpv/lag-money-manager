name: CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (src)
        run: npm run typecheck
      - name: Type-check (tests)
        run: npm run typecheck:tests
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
