services:
  # Single-node replica set. MongoDB multi-document transactions (used for
  # atomic balance adjustments) require a replica set — a standalone mongod
  # rejects them. Production runs on MongoDB Atlas, which is already a replica
  # set; this mirrors that locally. Auth is left off for local dev so no
  # inter-node keyfile is needed.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      start_period: 5s
      retries: 10
    networks:
      - lag

  # Lightweight MongoDB web UI (optional).
  mongoku:
    image: huggingface/mongoku
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      MONGOKU_DEFAULT_HOST: "mongodb://mongo:27017/?replicaSet=rs0"
    depends_on:
      - mongo
    networks:
      - lag

volumes:
  mongo_data:

networks:
  lag:
    driver: bridge
